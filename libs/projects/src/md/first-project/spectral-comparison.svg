<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="60" y="60" width="1080" height="510" rx="12" fill="#f8fafc"/>
  <text x="600" y="110" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#334159" text-anchor="middle">EMIT Spectral Signatures</text>
  <text x="600" y="135" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Synthetic plot: high vs. low infection areas</text>
  <g transform="translate(80,180)">
    <text x="30" y="0" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94a3b8" transform="rotate(-90,30,100)">Reflectance</text>
    <line x1="0" y1="220" x2="480" y2="220" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="220" stroke="#cbd5e1" stroke-width="1"/>
    <polyline points="0,200 40,190 80,195 120,185 160,200 200,195 240,190 280,195 320,190 360,200 400,195 440,190 480,200" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round"/>
    <polyline points="0,210 40,205 80,200 120,190 160,205 200,200 240,195 280,200 320,195 360,205 400,200 440,195 480,210" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round"/>
    <rect x="420" y="185" width="12" height="12" fill="#0ea5e9"/>
    <rect x="420" y="205" width="12" height="12" fill="#0284c7" fill-opacity="0.3"/>
    <line x1="438" y1="191" x2="520" y2="191" stroke="#0284c7" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="530" y="195" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#334159">Low infection</text>
    <rect x="420" y="205" width="12" fill="#0ea5e9"/>
    <text x="530" y="210" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#334159">High infection</text>
    <text x="240" y="430" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Wavelength (nm)</text>
    <line x1="20" y1="210" x2="20" y2="220" stroke="#334159" stroke-width="1.5"/>
    <text x="12" y="215" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="end">800</text>
    <line x1="120" y1="210" x2="120" y2="220" stroke="#334159" stroke-width="1.5"/>
    <text x="112" y="215" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="end">900</text>
    <line x1="220" y1="210" x2="220" y2="220" stroke="#334159" stroke-width="1.5"/>
    <text x="212" y="215" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="end">1000</text>
    <line x1="320" y1="210" x2="320" y2="220" stroke="#334159" stroke-width="1.5"/>
    <text x="312" y="215" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="end">1100</text>
    <line x1="420" y1="210" x2="420" y2="220" stroke="#334159" stroke-width="1.5"/>
    <text x="412" y="215" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="end">1200</text>
    <line x1="480" y1="210" x2="480" y2="220" stroke="#334159" stroke-width="1.5"/>
    <text x="472" y="215" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="end">1300</text>
  </g>
  <g transform="translate(600,180)">
    <rect x="0" y="0" width="180" height="120" rx="6" fill="#f1f5f9"/>
    <rect x="0" y="0" width="180" height="120" rx="6" fill="url(#emitGrad)"/>
    <defs>
      <linearGradient id="emitGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#bae6fd"/>
        <stop offset="1" stop-color="#0284c7"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="180" height="120" rx="6" fill="#ffffff" opacity="0.2"/>
    <text x="90" y="105" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle">NDVI</text>
    <text x="90" y="122" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">high infection</text>
  </g>
  <g transform="translate(820,180)">
    <rect x="0" y="0" width="180" height="120" rx="6" fill="#f8fafc"/>
    <rect x="0" y="0" width="180" height="120" rx="6" fill="url(#emitGrad2)"/>
    <defs>
      <linearGradient id="emitGrad2" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fef3c7"/>
        <stop offset="1" stop-color="#ea580c"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="180" height="120" rx="6" fill="#ffffff" opacity="0.3"/>
    <text x="90" y="105" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle">SWIR</text>
    <text x="90" y="122" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">low infection</text>
  </g>
  <text x="600" y="580" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Synthetic spectral plot — illustrative only, not real data</text>
</svg>