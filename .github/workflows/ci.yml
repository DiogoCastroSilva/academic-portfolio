name: CI & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

  # Workflow level: Available to all jobs and steps
env:
  NX_NO_CLOUD: true

jobs:
  # 1️⃣ Continuous Integration (Lint, Test, Build)
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Verify Nx workspace
        run: npx nx --version

      - name: Check formatting
        run: npx --no-install prettier --check .

      - name: Run CI Tasks
        run: npx nx run-many -t lint test typecheck build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: static-site-output
          path: public
          retention-days: 1

      - name: Nx Cloud Fix Suggestions
        if: always()
        run: npx nx fix-ci

  # 2️⃣ Performance audit – reusable Lighthouse CI workflow (report-only budgets)
  perf-audit:
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: DiogoCastroSilva/frontend-tooling/.github/workflows/performance-audit.yml@3e7274a576a7bd2b06c1d61950dc518d7301a8fc
    with:
      urls: "/, /about/, /projects/first-project/"
      artifact-name: static-site-output
      output-dir: public

  # 3️⃣ Deploy job – runs only if CI passes
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Ensure Nx is available
        run: npx nx --version

      - name: Set GitHub Pages environment variables
        run: |
          REPO="${GITHUB_REPOSITORY}"
          OWNER="${REPO%%/*}"
          NAME="${REPO#*/}"
          if [ "$NAME" = "${OWNER}.github.io" ]; then
            URL="https://${OWNER}.github.io"
            BASE_PATH=""
          else
            URL="https://${OWNER}.github.io/${NAME}"
            BASE_PATH="/${NAME}"
          fi
          echo "NEXT_PUBLIC_DEPLOYMENT_URL=$URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_BASE_PATH=$BASE_PATH" >> $GITHUB_ENV

            # ✅ Build and export Next.js app the Nx way
      - name: Build Next.js app
        run: npx nx build main

      - name: Generate sitemap and robots.txt
        run: npx nx run main:generate-sitemap

      - name: Show exported output
        run: ls -R public

        # ✅ Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
